name: Release Artifact Verifier

# FIX-011: full packed-artifact release gate.
#
# Verifies every public package (or a selected subset) as a clean consumer
# artifact: build -> exact tarball -> surface/bin/shebang checks -> fresh
# temporary install without workspace links -> root and subpath imports ->
# consumer typecheck -> bin smoke tests. Reports and tarball inventories are
# uploaded as CI artifacts.
#
# The fast PR gate stays `npm run guard:packages`; this workflow is the slow,
# complete matrix for release validation and package-affecting CI changes.
# Known, tracked artifact defects (scripts/known-package-defects.json,
# `packedArtifact` section) are tolerated only when allow_known_failures is
# true; a listed package that PASSES fails the run until its entry is removed.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to verify (empty = full 43-package matrix)'
        required: false
        default: ''
      # FIX-011: strict by default on every lane. `scripts/known-package-defects.json`
      # `packedArtifact` is empty and its enforced end-state is empty, so a
      # permissive default was a latent tolerance that would have silently
      # absorbed a future entry. Set this to 'true' explicitly to triage a
      # newly-listed defect; nothing sets it to 'true' by default.
      allow_known_failures:
        description: 'Tolerate packages listed under packedArtifact in scripts/known-package-defects.json'
        required: false
        default: 'false'
  workflow_call:
    inputs:
      packages:
        type: string
        required: false
        default: ''
      allow_known_failures:
        type: string
        required: false
        default: 'false'
      # The tree to verify. Empty means the ref that triggered the caller, which
      # is correct for the branch release. Tag recovery
      # (publish-packages-from-tag.yml) must pass the release tag explicitly,
      # otherwise the matrix would verify the dispatch ref instead of the tree
      # that is about to be published.
      ref:
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/verify-release-artifacts.mjs'
      - 'scripts/lib/publishable-packages.cjs'
      - 'scripts/lib/dependency-ownership.cjs'
      - 'scripts/known-package-defects.json'
      - 'scripts/__tests__/**'
      - '.github/workflows/release-artifact-verifier.yml'

permissions:
  contents: read

jobs:
  verify-artifacts:
    name: Packed-artifact verification
    runs-on: ubuntu-latest-l
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Empty resolves to the caller's triggering ref (branch release);
          # tag recovery passes the release tag.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Release tooling tests
        run: |
          set -euo pipefail
          npm run test:release-tooling

      - name: Verify packed artifacts
        env:
          VERIFIER_PACKAGES: ${{ inputs.packages || github.event.inputs.packages || '' }}
          VERIFIER_ALLOW_KNOWN_FAILURES: ${{ inputs.allow_known_failures || github.event.inputs.allow_known_failures || 'false' }}
        run: |
          set -euo pipefail
          args=(--report-dir artifacts/release-verifier)
          if [ "$VERIFIER_ALLOW_KNOWN_FAILURES" = "true" ]; then
            args+=(--allow-known-failures)
          fi
          for pkg in $VERIFIER_PACKAGES; do
            args+=(--package "$pkg")
          done
          node scripts/verify-release-artifacts.mjs "${args[@]}"

      - name: Upload verifier reports and tarball inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verifier-reports
          path: artifacts/release-verifier/
          if-no-files-found: warn
          retention-days: 30
