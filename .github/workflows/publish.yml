name: Publish

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NPM_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
  PUBLISH_BRANCH: ${{ github.ref_name }}
  NPM_CONFIG_AUDIT: "true"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --force

      - name: Build lint dependencies
        run: |
          npm run build --workspace=@a5c-ai/atlas

      - name: Lint SDK
        run: npm run lint --workspace=@a5c-ai/babysitter-sdk

      - name: Verify metadata
        run: npm run verify:metadata

  build_all:
    name: Build All
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Restore framework cache
        uses: actions/cache@v5
        with:
          path: |
            packages/adapters/webui/node_modules/.vite
            packages/atlas/webui/.next/cache
            packages/kradle/web/.next/cache
          key: framework-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            framework-${{ runner.os }}-${{ github.ref_name }}-
            build-${{ runner.os }}-

      - name: "Build phase 1: shared catalog foundation"
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/atlas
          npm run build --workspace=@a5c-ai/tasks-adapter


      - name: "Build phase 2: parallel independents and adapters critical path"
        run: |
          set -euo pipefail
          PIDS=()
          run_bg() {
            "$@" &
            PIDS+=("$!")
          }
          wait_all() {
            local fail=0
            for pid in "${PIDS[@]}"; do
              wait "$pid" || fail=1
            done
            PIDS=()
            [ "$fail" -eq 0 ] || exit 1
          }

          run_bg bash -lc '
            set -euo pipefail
            npm run build --workspace=@a5c-ai/hooks-adapter-core
            # Adapters are independent (only depend on core) — build in parallel
            for adapter in claude codex gemini copilot cursor pi oh-my-pi opencode openclaw hermes; do
              npm run build --workspace=@a5c-ai/hooks-adapter-$adapter &
            done
            wait
            npm run build --workspace=@a5c-ai/hooks-adapter-cli
          '
          run_bg npm run build --workspace=@a5c-ai/extensions-adapter
          run_bg npm run build --workspace=@a5c-ai/triggers-adapter
          run_bg npm run build:observer
          run_bg npm run build:cloud
          run_bg bash -lc '
            set -euo pipefail
            npm run build --workspace=@a5c-ai/kradle
            npm run build --workspace=@a5c-ai/comm-adapter
            npm run build --workspace=@a5c-ai/genty-ui
            npm run build --workspace=@a5c-ai/kradle-web
          '

          # adapters critical path (sequential — each depends on previous)
          npm run build --workspace=@a5c-ai/adapters-observability
          npm run build --workspace=@a5c-ai/comm-adapter

          leaf_pids=()
          npm run build --workspace=@a5c-ai/adapters-codecs & leaf_pids+=("$!")
          npm run build --workspace=@a5c-ai/adapters-harness-mock & leaf_pids+=("$!")
          npm run build --workspace=@a5c-ai/transport-adapter & leaf_pids+=("$!")
          leaf_fail=0
          for pid in "${leaf_pids[@]}"; do
            wait "$pid" || leaf_fail=1
          done
          [ "$leaf_fail" -eq 0 ] || exit 1

          npm run build --workspace=@a5c-ai/adapters-gateway
          npm run build --workspace=@a5c-ai/adapters-cli
          npm run build --workspace=@a5c-ai/adapters
          npm run build:local --workspace=@a5c-ai/genty-tui
          # genty-ui must be built before kradle-web (kradle imports genty-ui subpaths)
          npm run build --workspace=@a5c-ai/genty-ui
          # webui depends on core + ui — must be after adapters chain
          npm run build --workspace=@a5c-ai/genty-web-app

          # SDK, agent-core, agent-platform: prerequisites (atlas,
          # adapters chain) are already built above — call tsc directly to avoid
          # redundant rebuilds through chained npm scripts.
          npm run build --workspace=@a5c-ai/babysitter-sdk
          (cd packages/genty/core && npx tsc --build --force tsconfig.json)
          (cd packages/genty/platform && npx tsc --build tsconfig.json)

          wait_all

      - name: Package dist directories
        run: find packages -path '*/dist' -type d | tar czf /tmp/build-all-dist.tar.gz -T -

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-all-dist
          path: /tmp/build-all-dist.tar.gz
          if-no-files-found: error

  validate_core:
    needs: [build_all, lint]
    name: Validate Core Runtime
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/core-logs

      - name: Architecture boundary gate
        run: |
          set -euo pipefail
          npm run test:architecture 2>&1 | tee artifacts/core-logs/architecture.log

      - name: SDK tests
        run: |
          set -euo pipefail
          npm run test:sdk 2>&1 | tee artifacts/core-logs/sdk-tests.log

      - name: genty-core tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/genty-core 2>&1 | tee artifacts/core-logs/core-tests.log

      - name: babysitter-harness tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/genty-platform 2>&1 | tee artifacts/core-logs/babysitter-harness-tests.log

      - name: Upload core validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-core-logs
          path: artifacts/core-logs
          if-no-files-found: warn

  validate_mux:
    needs: build_all
    name: Validate Adapter Surfaces
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/adapter-logs

      - name: Hooks-proxy unit tests
        run: |
          set -euo pipefail
          npm run test:hooks-adapter 2>&1 | tee artifacts/adapter-logs/hooks-adapter-tests.log

      - name: Verify atlas graph data
        run: |
          set -euo pipefail
          echo "Atlas dist/index.json: $(wc -c < packages/atlas/dist/index.json) bytes"
          node -e "const i=require('./packages/atlas/dist/index.json'); console.log('Atlas records:', Object.keys(i.records).length, 'edges:', i.edges.length)"

      - name: adapters package tests
        run: |
          set -euo pipefail
          node scripts/adapters-build.cjs test packages/adapters/observability 2>&1 | tee artifacts/adapter-logs/adapters-observability-tests.log
          node scripts/adapters-build.cjs test packages/adapters/core 2>&1 | tee artifacts/adapter-logs/agent-comm-adapter-tests.log
          node scripts/adapters-build.cjs test packages/adapters/codecs 2>&1 | tee artifacts/adapter-logs/adapters-adapters-tests.log
          node scripts/adapters-build.cjs test packages/adapters/harness-mock 2>&1 | tee artifacts/adapter-logs/adapters-harness-mock-tests.log
          node scripts/adapters-build.cjs test packages/adapters/gateway 2>&1 | tee artifacts/adapter-logs/adapters-gateway-tests.log
          node scripts/adapters-build.cjs test packages/adapters/cli 2>&1 | tee artifacts/adapter-logs/adapters-cli-tests.log
          node scripts/adapters-build.cjs test packages/adapters/sdk 2>&1 | tee artifacts/adapter-logs/adapters-sdk-tests.log
          node scripts/adapters-build.cjs test packages/adapters/channels 2>&1 | tee artifacts/adapter-logs/channels-tests.log
          npm run test:unit --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/adapter-logs/triggers-tests.log

      - name: Verify non-realtime adapters release artifacts
        run: |
          set -euo pipefail
          npm run verify:release --workspace=@a5c-ai/comm-adapter 2>&1 | tee artifacts/adapter-logs/agent-comm-adapter-release.log
          npm run verify:release --workspace=@a5c-ai/genty-tui 2>&1 | tee artifacts/adapter-logs/adapters-tui-release.log

      - name: Validate transport-adapter runtime owner
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/adapter-logs/transport-adapter-tests.log
          npm run scorecard:migration --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/adapter-logs/transport-adapter-scorecard.log

      - name: Upload adapter validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-adapter-logs
          path: artifacts/adapter-logs
          if-no-files-found: warn

  e2e_integration:
    needs:
      - validate_core
      - validate_mux
      - validate_kradle
      - validate_cloud
      - validate_observer_and_compiler
    name: E2E Integration Tests
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: mkdir -p artifacts/e2e-logs

      - name: Triggers e2e + coverage
        run: |
          set -euo pipefail
          npm run test:e2e --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/e2e-logs/triggers-e2e.log
          npm run test:coverage --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/e2e-logs/triggers-coverage.log

      - name: Kradle e2e + smoke
        run: |
          set -euo pipefail
          cd packages/kradle/core
          npm run e2e 2>&1 | tee ../../../artifacts/e2e-logs/kradle-e2e.log
          npm run smoke 2>&1 | tee ../../../artifacts/e2e-logs/kradle-smoke.log

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: adapters webui browser e2e
        run: npm run test:e2e --workspace=@a5c-ai/genty-web-app

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-e2e-logs
          path: artifacts/e2e-logs
          if-no-files-found: warn

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-adapter-playwright-artifacts
          path: |
            packages/adapters/webui/.tmp/playwright-report
            packages/adapters/webui/.tmp/playwright-test-results
          if-no-files-found: warn

  validate_cloud:
    needs: build_all
    name: Validate Cloud Workspace
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloud-logs

      - name: Validate cloud deployment workspace
        run: |
          set -euo pipefail
          npm run test:cloud 2>&1 | tee artifacts/cloud-logs/cloud-tests.log
          npm run coverage:cloud 2>&1 | tee artifacts/cloud-logs/cloud-coverage.log
          npm run verify:cloud-release 2>&1 | tee artifacts/cloud-logs/cloud-release.log

      - name: Upload cloud validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-cloud-logs
          path: artifacts/cloud-logs
          if-no-files-found: warn

  validate_kradle:
    needs: build_all
    name: Validate Kradle
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/kradle-logs

      - name: Build Helm dependencies
        run: helm dependency build packages/kradle/charts 2>&1 | tee artifacts/kradle-logs/helm-dep-build.log || true

      - name: Test kradle core
        run: |
          set -euo pipefail
          cd packages/kradle/core && npm test 2>&1 | tee ../../../artifacts/kradle-logs/core-tests.log

      - name: Upload kradle validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-kradle-logs
          path: artifacts/kradle-logs
          if-no-files-found: warn

  validate_observer_and_compiler:
    needs: build_all
    name: Validate Observer And Compiler
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all-dist
          path: /tmp

      - name: Extract build artifacts
        run: tar xzf /tmp/build-all-dist.tar.gz

      - name: Prepare artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts/observer-compiler-logs

      - name: Test adapters-extensions
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/extensions-adapter 2>&1 | tee artifacts/observer-compiler-logs/adapters-extensions-tests.log

      - name: Generate unified plugin bundles
        run: |
          set -euo pipefail
          npm run generate:plugins 2>&1 | tee artifacts/observer-compiler-logs/generated-plugin-bundles.log

      - name: Test observer-dashboard
        run: |
          set -euo pipefail
          npm run test:observer 2>&1 | tee artifacts/observer-compiler-logs/observer-dashboard-tests.log

      - name: Upload observer and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-observer-compiler-logs
          path: artifacts/observer-compiler-logs
          if-no-files-found: warn

  prepare_staging_publish:
    if: >-
      !cancelled()
      && needs.lint.result == 'success'
      && needs.build_all.result == 'success'
      && needs.validate_core.result == 'success'
      && needs.validate_mux.result == 'success'
      && needs.e2e_integration.result == 'success'
      && needs.validate_cloud.result == 'success'
      && needs.validate_kradle.result == 'success'
      && needs.validate_observer_and_compiler.result == 'success'
    name: Prepare Publish
    needs:
      - lint
      - build_all
      - validate_core
      - validate_mux
      - e2e_integration
      - validate_cloud
      - validate_kradle
      - validate_observer_and_compiler
    runs-on: ubuntu-latest-l
    permissions:
      contents: write
    outputs:
      staging_version_sdk: ${{ steps.version.outputs.staging_version_sdk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/
          token: ${{ secrets.NPM_TOKEN }}

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci --force
          npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Set publish version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          case "${GITHUB_REF_NAME}" in
            main)
              PUBLISH_VERSION="$BASE_VERSION"
              ;;
            staging|develop)
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
              NEXT_PATCH=$((PATCH + 1))
              PUBLISH_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-${GITHUB_REF_NAME}.${SHORT_SHA}"
              ;;
            *)
              echo "Unsupported publish branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_unified=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_sdk=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_agent_mux=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_codex=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_github=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_cursor=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_gemini=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_pi=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_omp=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_opencode=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_version_openclaw=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "Setting ${GITHUB_REF_NAME} publish version: $PUBLISH_VERSION"
          node scripts/sync-workspace-versions.mjs --version "$PUBLISH_VERSION"

      - name: Prepare workspace manifests for publish
        run: |
          set -euo pipefail
          node scripts/sync-workspace-versions.mjs --version "$STAGING_VERSION"
        env:
          STAGING_VERSION: ${{ steps.version.outputs.staging_version_sdk }}

      - name: Refresh publish lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --workspaces --include-workspace-root

      - name: Bundle publish workspace
        run: |
          set -euo pipefail
          mkdir -p artifacts/publish-source
          tar --exclude=.git --exclude=node_modules --exclude=artifacts -czf artifacts/publish-source/publish-source.tgz .

      - name: Upload publish workspace
        uses: actions/upload-artifact@v4
        with:
          name: publish-source
          path: artifacts/publish-source/publish-source.tgz
