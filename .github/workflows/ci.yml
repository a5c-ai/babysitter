name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-quality:
    name: Docs QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Prepare docs QA artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/docs-qa

      - name: Docs quality gates
        run: |
          set -euo pipefail
          npm run docs:qa 2>&1 | tee artifacts/docs-qa/docs-qa.log

      - name: Upload docs QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-qa
          path: artifacts/docs-qa
          if-no-files-found: error

  test:
    name: Lint, Tests, Package
    # Larger runner to match publish.yml for the heavy "Build babysitter-harness"
    # step (rebuilds atlas's ~17k-record index + genty-core + genty-platform).
    runs-on: ubuntu-latest-l
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Prepare artifact directories
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-logs

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint --workspace=@a5c-ai/babysitter-sdk 2>&1 | tee artifacts/test-logs/lint.log

      - name: Verify metadata
        run: |
          set -euo pipefail
          npm run verify:metadata 2>&1 | tee artifacts/test-logs/metadata.log

      - name: Release tooling tests (inventory, dependency ownership, packed-artifact verifier)
        run: |
          set -euo pipefail
          npm run test:release-tooling 2>&1 | tee artifacts/test-logs/release-tooling.log

      # FIX-007: packed-metapackage exit-code gate — packs @a5c-ai/babysitter,
      # installs the exact tarball into a clean temporary consumer with a
      # deterministic SDK CLI stub, and asserts the shim propagates the CLI's
      # resolved exit code (0 and 7), reports a rejection as one handled error
      # with exit 1, and still prints missing-SDK repair guidance.
      - name: Metapackage shim tests (packed exit-code propagation)
        run: |
          set -euo pipefail
          npm run test:babysitter-metapackage 2>&1 | tee artifacts/test-logs/babysitter-metapackage-tests.log

      - name: Architecture boundary gate
        run: |
          set -euo pipefail
          npm run test:architecture 2>&1 | tee artifacts/test-logs/architecture.log

      - name: Build adapters-tasks
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/tasks-adapter 2>&1 | tee artifacts/test-logs/adapters-tasks-build.log

      - name: Build runtime graph
        run: |
          set -euo pipefail
          npm run build:runtime 2>&1 | tee artifacts/test-logs/build.log

      - name: Unit tests
        run: |
          set -euo pipefail
          npm run test:sdk 2>&1 | tee artifacts/test-logs/unit-tests.log

      - name: Typecheck adapters-tasks
        run: |
          set -euo pipefail
          npm run typecheck --workspace=@a5c-ai/tasks-adapter 2>&1 | tee artifacts/test-logs/adapters-tasks-typecheck.log

      - name: adapters-tasks tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/tasks-adapter 2>&1 | tee artifacts/test-logs/adapters-tasks-tests.log

      # FIX-012: packaged-surface parity gate — builds and packs the tasks
      # adapter, installs the exact tarball into a clean temporary consumer,
      # imports the root plus every exports subpath, and typechecks a consumer.
      # FIX-002 landed (@modelcontextprotocol/sdk is now a declared direct
      # runtime dependency) and its scripts/known-package-defects.json
      # packedArtifact entry was deleted, so this gate runs strictly: any
      # clean-consumer packaging failure fails CI.
      - name: adapters-tasks packaged-surface parity
        run: |
          set -euo pipefail
          npm run test:packaged-surface-parity --workspace=@a5c-ai/tasks-adapter 2>&1 | tee artifacts/test-logs/tasks-adapter-test-packaged-surface-parity.log

      - name: Build hooks-adapter
        run: |
          set -euo pipefail
          npm run build:hooks-adapter 2>&1 | tee artifacts/test-logs/hooks-adapter-build.log

      - name: Hooks-proxy unit tests
        run: |
          set -euo pipefail
          npm run test:hooks-adapter 2>&1 | tee artifacts/test-logs/hooks-adapter-tests.log

      - name: Build adapters packages
        run: |
          set -euo pipefail
          npm run build:adapters 2>&1 | tee artifacts/test-logs/adapters-build.log

      - name: Policy / tools / trust-core adapter gates
        run: |
          set -euo pipefail
          # These packages ship the proof-based policy/trust authorization gates.
          # Their suites previously ran in no workflow, so authorization-gate
          # wiring could be deleted with a fully green build (release-QA RC/C1-C2).
          npm run test --workspace=@a5c-ai/trust-core 2>&1 | tee artifacts/test-logs/trust-core-tests.log
          npm run build --workspace=@a5c-ai/policy-adapter 2>&1 | tee artifacts/test-logs/policy-adapter-build.log
          npm run typecheck --workspace=@a5c-ai/policy-adapter 2>&1 | tee artifacts/test-logs/policy-adapter-typecheck.log
          npm run test --workspace=@a5c-ai/policy-adapter 2>&1 | tee artifacts/test-logs/policy-adapter-tests.log
          npm run build --workspace=@a5c-ai/tools-adapter 2>&1 | tee artifacts/test-logs/tools-adapter-build.log
          npm run typecheck --workspace=@a5c-ai/tools-adapter 2>&1 | tee artifacts/test-logs/tools-adapter-typecheck.log
          npm run test --workspace=@a5c-ai/tools-adapter 2>&1 | tee artifacts/test-logs/tools-adapter-tests.log

      - name: Build Atlas packages
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/atlas 2>&1 | tee artifacts/test-logs/atlas-build.log

      - name: Build triggers package
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/test-logs/triggers-build.log

      - name: Triggers unit tests
        run: |
          set -euo pipefail
          npm run test:unit --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/test-logs/triggers-unit-tests.log

      - name: Triggers e2e tests
        run: |
          set -euo pipefail
          npm run test:e2e --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/test-logs/triggers-e2e-tests.log

      - name: Triggers coverage tests
        run: |
          set -euo pipefail
          npm run test:coverage --workspace=@a5c-ai/triggers-adapter 2>&1 | tee artifacts/test-logs/triggers-coverage.log

      - name: adapters-tui release verification
        run: |
          set -euo pipefail
          npm run verify:release --workspace=@a5c-ai/genty-tui 2>&1 | tee artifacts/test-logs/adapters-tui-release.log

      - name: agent-comm-adapter release verification
        run: |
          set -euo pipefail
          npm run verify:release --workspace=@a5c-ai/comm-adapter 2>&1 | tee artifacts/test-logs/agent-comm-adapter-release.log

      - name: Build realtime flow surfaces
        run: |
          set -euo pipefail
          npm run build:realtime-flow 2>&1 | tee artifacts/test-logs/realtime-flow-build.log

      - name: Realtime flow tests
        run: |
          set -euo pipefail
          npm run test:realtime-flow 2>&1 | tee artifacts/test-logs/realtime-flow-tests.log

      - name: Realtime flow release verification
        run: |
          set -euo pipefail
          npm run verify:realtime-flow-release 2>&1 | tee artifacts/test-logs/realtime-flow-release.log

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium 2>&1 | tee artifacts/test-logs/adapters-webui-playwright-install.log

      - name: adapters webui browser e2e
        run: |
          set -euo pipefail
          npm run test:e2e --workspace=@a5c-ai/genty-web-app 2>&1 | tee artifacts/test-logs/adapters-webui-browser-e2e.log

      - name: Build adapters-extensions
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/extensions-adapter 2>&1 | tee artifacts/test-logs/adapters-extensions-build.log

      - name: adapters-extensions tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/extensions-adapter 2>&1 | tee artifacts/test-logs/adapters-extensions-tests.log

      - name: Build babysitter-harness
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/genty-core 2>&1 | tee artifacts/test-logs/core-build.log
          npm run build --workspace=@a5c-ai/genty-platform 2>&1 | tee artifacts/test-logs/babysitter-harness-build.log

      - name: genty-core tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/genty-core 2>&1 | tee artifacts/test-logs/core-tests.log

      - name: babysitter-harness tests
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/genty-platform 2>&1 | tee artifacts/test-logs/babysitter-harness-tests.log

      - name: Generate unified plugin bundles
        run: |
          set -euo pipefail
          npm run generate:plugins 2>&1 | tee artifacts/test-logs/generated-plugin-bundles.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: artifacts/test-logs
          if-no-files-found: error


      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adapters-webui-playwright-artifacts
          path: |
            packages/adapters/webui/.tmp/playwright-report
            packages/adapters/webui/.tmp/playwright-test-results
          if-no-files-found: ignore

  # FIX-008: @a5c-ai/adapters-gateway loads the built-in node:sqlite module from
  # its package root, and node:sqlite is only importable without
  # --experimental-sqlite from Node 22.13.0 onward. This job runs the gateway
  # suite (including tests/node-engine-floor.test.ts, which re-derives the floor
  # from the built root import graph and pins README + this matrix to it) on the
  # exact declared minimum as well as on the current 22.x line.
  #
  # The same floor is inherited by every package whose published entrypoints
  # statically evaluate the gateway — today @a5c-ai/adapters-cli and
  # @a5c-ai/adapters. That set is derived from the sources (not a hand list) by
  # scripts/__tests__/gateway-engine-floor.test.mjs, and the CLI's runtime proof
  # (packages/adapters/cli/tests/node-engine-floor.test.ts) runs in this matrix
  # too so the floor is exercised on the exact declared minimum.
  gateway-node-engine:
    name: Gateway Node engine floor
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # The first entry MUST equal the engines.node floor of
        # packages/adapters/gateway/package.json.
        node-version: ['22.13.0', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Build adapters gateway
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/adapters-gateway

      - name: Gateway tests (SQLite-backed, on Node ${{ matrix.node-version }})
        run: |
          set -euo pipefail
          npm run test --workspace=@a5c-ai/adapters-gateway

      - name: Build adapters CLI
        run: |
          set -euo pipefail
          npm run build:adapters:non-realtime

      - name: Adapters CLI Node engine floor (on Node ${{ matrix.node-version }})
        run: |
          set -euo pipefail
          npx vitest run --config packages/adapters/cli/vitest.config.ts packages/adapters/cli/tests/node-engine-floor.test.ts

      - name: Gateway-inherited engine floors (manifests and docs)
        run: |
          set -euo pipefail
          node --test scripts/__tests__/gateway-engine-floor.test.mjs

  workspace-coverage:
    name: Workspace Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Prepare artifact directories
        run: |
          set -euo pipefail
          mkdir -p artifacts/workspace-coverage-logs

      - name: Declare active workspace coverage
        run: |
          set -euo pipefail
          cat <<'EOF' | tee artifacts/workspace-coverage-logs/coverage-manifest.log
          Active workspace coverage map
          ===========================

          Release-critical workspaces validated in other CI/release jobs:
          - @a5c-ai/babysitter-sdk -> test + packages-sdk + release/staging publish
          - @a5c-ai/tasks-adapter -> test + release/staging publish
          - @a5c-ai/extensions-adapter -> test + release/staging publish
          - @a5c-ai/babysitter-observer-dashboard -> observer-dashboard + release/staging publish
          - @a5c-ai/kradle-installer -> workspace-coverage + release/staging publish + deploy-hook paths
          - @a5c-ai/hooks-adapter-* -> test + release/staging publish
          - @a5c-ai/adapters-* -> test + release/staging publish
          - @a5c-ai/babysitter + unified plugin compiler/bundles -> test + release/staging publish paths

          Additional active workspaces validated in this job:
          - @a5c-ai/genty-tui-plugins
          - @a5c-ai/transport-adapter (build + lint + typecheck + test + migration scorecard)

      - name: Build transport-adapter dependency foundation
        run: |
          set -euo pipefail
          # transport-adapter now depends on @a5c-ai/trust-core and
          # @a5c-ai/policy-adapter (proxy attestation wiring); their `types`
          # resolve to built dist/*.d.ts, so this isolated job must build the
          # dependency closure in order before validating transport — otherwise
          # `tsc --build` fails with TS2307 (release-QA Caveat 1).
          npm run build --workspace=@a5c-ai/atlas 2>&1 | tee artifacts/workspace-coverage-logs/atlas-build.log
          npm run build --workspace=@a5c-ai/trust-core 2>&1 | tee artifacts/workspace-coverage-logs/trust-core-build.log
          npm run build --workspace=@a5c-ai/tasks-adapter 2>&1 | tee artifacts/workspace-coverage-logs/tasks-adapter-build.log
          npm run build --workspace=@a5c-ai/policy-adapter 2>&1 | tee artifacts/workspace-coverage-logs/policy-adapter-build.log
          npm run build --workspace=@a5c-ai/adapters-observability 2>&1 | tee artifacts/workspace-coverage-logs/adapters-observability-build.log
          npm run build --workspace=@a5c-ai/comm-adapter 2>&1 | tee artifacts/workspace-coverage-logs/comm-adapter-build.log

      - name: Validate transport-adapter workspace QA surface
        run: |
          set -euo pipefail
          npm run build --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/workspace-coverage-logs/transport-adapter-build.log
          npm run lint --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/workspace-coverage-logs/transport-adapter-lint.log
          npm run typecheck --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/workspace-coverage-logs/transport-adapter-typecheck.log
          npm run test --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/workspace-coverage-logs/transport-adapter-test.log
          npm run scorecard:migration --workspace=@a5c-ai/transport-adapter 2>&1 | tee artifacts/workspace-coverage-logs/transport-adapter-scorecard.log

      - name: Validate cloud deployment workspace QA surface
        run: |
          set -euo pipefail
          npm run build:cloud 2>&1 | tee artifacts/workspace-coverage-logs/cloud-build.log
          npm run test:cloud 2>&1 | tee artifacts/workspace-coverage-logs/cloud-test.log
          npm run coverage:cloud 2>&1 | tee artifacts/workspace-coverage-logs/cloud-coverage.log
          npm run verify:cloud-release 2>&1 | tee artifacts/workspace-coverage-logs/cloud-release.log

      - name: Upload workspace coverage logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-coverage-logs
          path: artifacts/workspace-coverage-logs
          if-no-files-found: error

  observer-dashboard:
    name: Observer Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          # Workaround: npm ci on Windows-generated lockfile may miss linux optional deps
          npm install --no-save @rollup/rollup-linux-x64-gnu @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @next/swc-linux-x64-gnu @unrs/resolver-binding-linux-x64-gnu 2>/dev/null || true

      - name: Prepare artifact directories
        run: |
          set -euo pipefail
          mkdir -p artifacts/observer-logs

      - name: Build observer dashboard
        run: |
          set -euo pipefail
          npm run build:observer 2>&1 | tee artifacts/observer-logs/build.log

      - name: Build CLI
        run: |
          set -euo pipefail
          npm run build:cli --workspace=@a5c-ai/babysitter-observer-dashboard 2>&1 | tee artifacts/observer-logs/build-cli.log

      - name: Unit tests
        run: |
          set -euo pipefail
          npm run test:observer 2>&1 | tee artifacts/observer-logs/unit-tests.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observer-logs
          path: artifacts/observer-logs
          if-no-files-found: error
