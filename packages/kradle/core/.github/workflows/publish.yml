name: Kradle Publish

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [main]

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run check suite
        run: npm run check
      - name: Package tarball
        run: npm pack --json
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
      - name: Upload ui standalone
        uses: actions/upload-artifact@v4
        with:
          name: ui-standalone
          path: ../web/.next/standalone/
      - name: Generate release checksums
        run: |
          mkdir -p dist/checksums
          sha256sum *.tgz dist/**/* > dist/checksums/SHA256SUMS 2>/dev/null || true
      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/checksums/

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/kradle-controller:${{ github.sha }}

  publish-chart:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Helm chart
        run: |
          mkdir -p dist/charts
          helm package charts/kradle -d dist/charts/
      - name: Generate chart checksums
        run: |
          cd dist/charts
          sha256sum dist/charts/*.tgz > SHA256SUMS
      - name: Push chart to OCI registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm push dist/charts/*.tgz oci://ghcr.io/${{ github.repository }}/charts
