  sourcePackage: "@anthropic-ai/claude-code"
  upstreamReleaseTag: "v2.1.210"
  releaseNotesUrl: "https://github.com/anthropics/claude-code/releases/tag/v2.1.210"
  cliCommand: "claude"
  summary: "Claude Code release adding visible long-running tool elapsed time and fixing worktree isolation, attach stability, hook timeout classification, plugin MCP server lifecycle, auto mode defaults, and background agent session handling."
  assimilationNotes:
    - "Latest npm moved from recorded 2.1.209 to 2.1.210."
    - "Collapsed tool summaries now show a live elapsed-time counter for long-running tool calls, affecting TUI timeline/tool-state rendering expectations."
    - "Startup now warns on Write(path), NotebookEdit(path), and Glob(path) permission rules and recommends Edit(path) or Read(path), affecting permission-rule validation and docs."
    - "isolation: 'worktree' subagents can no longer run git-mutating commands against the main checkout, affecting subagent sandbox/worktree lifecycle assumptions."
    - "claude attach waits for daemon session transitions to settle and buffers terminal resizes during slow attach, affecting remote-control attach retry behavior."
    - "Hook callback timeouts are no longer reported to the model as user rejections, affecting unattended hook failure classification."
    - "Plugin-provided MCP servers are no longer torn down during mid-session MCP re-syncs, affecting plugin/MCP server lifecycle handling."
    - "Auto mode now defaults the permission classifier to Sonnet 5 for external sessions after validation on the first request."
    - "No package-name, install-method, transport/API migration, or model-default migration was published; install remains npm install -g @anthropic-ai/claude-code."
  releaseHighlights:
    - "Live elapsed-time counter on collapsed tool summaries."
    - "Permission-rule startup warnings for path-specific Write, NotebookEdit, and Glob rules."
    - "Worktree isolation fix for git-mutating subagent commands."
    - "More reliable claude attach during daemon session transitions."
    - "Hook timeout classification fix for unattended sessions."
    - "Plugin MCP server lifecycle fix during re-sync."
    - "Sonnet 5 permission classifier default for external auto-mode sessions."
  installMethods:
    - install:npm
edges:
  version_of:
    - agent:claude-code
  sourced_from:
    - evidence:claude-code-2-1-210-2026-07-15
