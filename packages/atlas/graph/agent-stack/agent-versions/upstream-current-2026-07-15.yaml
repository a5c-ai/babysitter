  summary: "Pi release replacing openai-responses sendSessionIdHeader with sessionAffinityFormat, adding cache-friendly dynamic tool loading, Ctrl+X message copy, Fable 5 xhigh/max thinking, OpenAI/Codex Responses toolChoice support, and multiple provider/auth/cache fixes."
