    - "Migration note: replace sendSessionIdHeader: false with sessionAffinityFormat: openai-nosession."
    - "Extensions can now add tools during execution while supported Anthropic and OpenAI Responses models preserve prompt-cache prefixes, affecting extension tool-loading and cache planning."
