    - "Latest official stable release moved from recorded 17.0.2 to 17.0.4."
    - "Kimi Code usage now carries 5h reset times correctly, affecting usage reporting parsers."
    - "Kimi device-id persistence is best-effort when ~/.omp/agent is missing or unwritable, preventing fresh-install usage probes from being silently nulled."
