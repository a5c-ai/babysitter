    - "MCP OAuth scope propagation fixes."
    - "Explicit OpenAI tool.strict false preservation."
    - "Tool-call enum and identifier newline trimming."
    - "Bounded large artifact:// raw reads."
    - "ACP terminal/create shell wrapping."
    - "Mnemopi retention and Windows compaction/session fixes."
