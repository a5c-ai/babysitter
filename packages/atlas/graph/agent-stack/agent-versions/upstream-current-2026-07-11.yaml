  upstreamReleaseTag: "v2.1.207"
  releaseNotesUrl: "https://github.com/anthropics/claude-code/releases/tag/v2.1.207"
  cliCommand: "claude"
  summary: "Claude Code release making auto mode available on managed providers, changing Claude Opus defaults, and hardening managed settings, plugin config, transcripts, MCP, and launcher behavior."
  assimilationNotes:
    - "Latest npm moved from recorded 2.1.206 to 2.1.207."
    - "Auto mode is available without CLAUDE_CODE_ENABLE_AUTO_MODE on Bedrock, Vertex AI, and Foundry and can be disabled via disableAutoMode in settings, affecting auto-mode capability and settings modeling."
    - "Bedrock, Vertex, and Claude Platform on AWS now default to Claude Opus 4.8, affecting provider/model default catalogs."
    - "Auto mode no longer reads autoMode from repo-resident .claude/settings.local.json; user settings are required, affecting launch/config resolution."
    - "Non-interactive remote managed settings are no longer permanently recorded as consented without a security consent dialog, affecting SDK and claude -p trust handling."
    - "Shell-form plugin hooks, monitors, and MCP headersHelper commands now reject ${user_config.*}; exec-form hooks or CLAUDE_PLUGIN_OPTION_* variables are required, affecting plugin command generation."
    - "Project-level .claude/settings.json no longer supplies pluginConfigs; only user, --settings, and managed settings are honored."
    - "No package-name or install-method migration was published; install remains npm install -g @anthropic-ai/claude-code."
  releaseHighlights:
    - "Auto mode enabled on Bedrock, Vertex AI, and Foundry without env opt-in."
    - "Bedrock, Vertex, and Claude Platform on AWS default to Claude Opus 4.8."
    - "Plugin user_config shell interpolation rejection."
    - "Managed settings consent and pluginConfigs scope fixes."
    - "Terminal streaming, transcript, worktree, Remote Control, and Bedrock SSO fixes."
  installMethods:
    - install:npm
edges:
  version_of:
    - agent:claude-code
  sourced_from:
    - evidence:claude-code-2-1-207-2026-07-11
