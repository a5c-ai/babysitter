  releaseNotesUrl: "https://github.com/github/copilot-cli/releases/tag/v1.0.79"
  cliCommand: "gh"
  summary: "GitHub Copilot CLI release changing sandbox policy/settings behavior, adding worktree base controls, plugin extension support, kimi-k3 support, plan-plus-autopilot mode, concurrent session management, queued local prompts/commands, and multiple sandbox/auth fixes."
  assimilationNotes:
    - "Latest official stable release moved from recorded 1.0.78 to 1.0.79."
    - "BREAKING: sandbox setting allowDevToolCaches was renamed to allowDevToolAccess; the old key is ignored."
    - "Sandbox auth settings moved from sandbox.gitAuth and sandbox.ghAuth to sandbox.auth.git and sandbox.auth.gh; old SDK request keys are rejected as invalid."
    - "Enterprise allow-auto-only policy allows /allow-all auto while blocking full allow-all, affecting permission-policy modeling."
