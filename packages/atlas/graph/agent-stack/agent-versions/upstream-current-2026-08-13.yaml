id: agentVersion:omp:17-3-0
attributes:
  agentId: "omp"
  agentProductId: agent:omp
  displayName: "Oh-My-Pi 17.3.0"
  runtimeFamily: "cli-harness"
  releaseChannel: "stable"
  versionRange: "17.3.0"
  currentVersion: "17.3.0"
  releasedAt: "2026-08-13"
  sourcePackage: "@oh-my-pi/pi-coding-agent"
  upstreamReleaseTag: "v17.3.0"
  releaseNotesUrl: "https://github.com/can1357/oh-my-pi/releases/tag/v17.3.0"
  cliCommand: "omp"
  summary: "Oh-My-Pi release adding model/catalog support for OpenAI Daybreak and GPT-5.6 Cyber models, Nix support, per-agent advisors, a redesigned /agents hub, authoritative OpenCode Go usage, and multiple breaking configuration/API changes around thinking-loop guards, advisor settings, and OpenAICompat metadata."
  assimilationNotes:
    - "Latest npm moved from recorded 17.2.12 to 17.3.0."
    - "Breaking API rename: withGeminiThinkingLoopGuard became withThinkingLoopGuard and now applies to Gemini, DeepSeek, and Grok model-id families."
    - "Breaking catalog removal: OpenAICompat.enableGeminiThinkingLoopGuard was removed; thinking-loop eligibility is derived from model.id family."
    - "Breaking config removal: advisor.subagents was removed; subagent advisors move to per-agent frontmatter or task.agentAdvisor, with advisor.subagents: true auto-migrating to task.agentAdvisor: { task: \"on\" }."
    - "OpenCode Go integration now uses the official usage endpoint with real-time credential validation and multi-key routing by headroom, replacing hardcoded caps and legacy local request-cost estimates."
    - "OpenAI Daybreak Blue, Daybreak Red, and GPT-5.6 Cyber models were added with long-context pricing, token limits, tools, and reasoning-effort controls."
    - "Ollama, DeepSeek, xAI, Together AI, Perplexity, DashScope, Anthropic cache-write, OpenAI/Daybreak thinking, and provider credential-health fixes affect provider capability and transport metadata."
    - "First-party Nix support adds reproducible source builds, a pinned development shell, NixOS and Home Manager modules, and offline Bun dependency support."
    - "The /agents interface was redesigned as a fullscreen hub with scope sidebar, type-to-filter search, pinned detail pane, mouse support, and property chips."
    - "omp update and startup version checks now follow the omp.rename pointer in the published manifest in preparation for an npm package rename."
    - "Install command remains npm install -g @oh-my-pi/pi-coding-agent for this version."
  releaseHighlights:
    - "Breaking thinking-loop guard API rename."
    - "advisor.subagents removal with task.agentAdvisor migration."
    - "OpenAICompat.enableGeminiThinkingLoopGuard removal."
    - "Official OpenCode Go usage endpoint integration."
    - "OpenAI Daybreak and GPT-5.6 Cyber model metadata."
    - "First-party Nix support."
    - "Per-agent advisors and redesigned /agents hub."
    - "Preparation for upcoming npm package rename via omp.rename manifest pointer."
  installMethods:
    - install:npm
  breakingChanges:
    - from: "withGeminiThinkingLoopGuard"
      to: "withThinkingLoopGuard"
      affectedSurface: "pi-ai provider guard integration"
    - removed: "OpenAICompat.enableGeminiThinkingLoopGuard"
      affectedSurface: "pi-catalog OpenAI-compatible metadata"
    - removed: "advisor.subagents"
      replacement: "task.agentAdvisor or per-agent advisor frontmatter"
  providerCatalog:
    addedModels:
      - "OpenAI Daybreak Blue"
      - "OpenAI Daybreak Red"
      - "GPT-5.6 Cyber"
    reasoningEffortControls:
      - "off"
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
  packageRename:
    manifestPointer: "omp.rename"
    status: "prepared; package name unchanged for 17.3.0"
edges:
  version_of:
    - agent:omp
  sourced_from:
    - evidence:omp-17-3-0-2026-08-13
