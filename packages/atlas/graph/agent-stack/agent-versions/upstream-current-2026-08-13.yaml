id: agentVersion:claude:2-1-229
attributes:
  agentId: "claude"
  agentProductId: agent:claude-code
  displayName: "Claude Code 2.1.229"
  runtimeFamily: "cli-harness"
  releaseChannel: "stable"
  versionRange: "2.1.229"
  currentVersion: "2.1.229"
  releasedAt: "2026-08-12"
  sourcePackage: "@anthropic-ai/claude-code"
  upstreamReleaseTag: "v2.1.229"
  releaseNotesUrl: "https://github.com/anthropics/claude-code/releases/tag/v2.1.229"
  cliCommand: "claude"
  summary: "Claude Code release adding Remote Control continuation docs, server-supplied self-hosted-runner hooks, gateway SSE keepalive pings, plugin marketplace command sources, and multiple terminal/Remote Control reliability fixes."
  assimilationNotes:
    - "Latest npm moved from recorded 2.1.226 to 2.1.229."
    - "Documented claude remote-control --continue affects Remote Control launch/resume command modeling."
    - "Server-supplied Claude Code hook support for self-hosted runner sessions affects hook-adapter parity with managed environments."
    - "SSE keepalive pings during long thinking pauses affect gateway streaming timeout assumptions for Vertex and Bedrock upstreams."
    - "Plugin marketplace command sources allow a local command to resolve a plugin directory each session; plugin discovery/install metadata should model command-backed sources and mode: link."
    - "ListAgents now distinguishes offline Remote Control sessions and cloud sessions, affecting session-state projections."
    - "Changed /commit-push-pr safety so git/gh commands with dangerous flags such as --force, --amend, and --no-verify are no longer auto-approved."
    - "Self-hosted runner Windows startup now requires explicit --base-dir."
    - "Install command remains npm install -g @anthropic-ai/claude-code."
  releaseHighlights:
    - "claude remote-control --continue documentation."
    - "Server-supplied hooks for self-hosted runner sessions."
    - "SSE keepalive pings for gateway streaming responses."
    - "Plugin marketplace command sources with link mode."
    - "Remote Control session offline/cloud labels."
    - "Safer /commit-push-pr auto-approval behavior."
  installMethods:
    - install:npm
  launchBehavior:
    promptExtraFlags:
      - flag: "--base-dir"
        valueName: "path"
        appliesTo: "self-hosted runner Windows startup"
        introducedIn: "2.1.229"
        notes: "Required explicitly on Windows self-hosted runners; there is no default checkout directory."
  remoteControl:
    continueMostRecentCommand: "claude remote-control --continue"
    listAgentsSessionStates:
      - "offline"
      - "cloud"
  pluginDiscovery:
    marketplaceCommandSources: true
    sourceMode:
      - "link"
    notes: "A command source can print a plugin directory that is re-resolved every session and applied without a restart."
  gatewayStreaming:
    sseKeepalivePings: true
    upstreams:
      - "Vertex"
      - "Bedrock"
edges:
  version_of:
    - agent:claude-code
  sourced_from:
    - evidence:claude-code-2-1-229-2026-08-13
