  pricingNotes: |
    Anthropic's model overview lists Claude Sonnet 5 at $3/MTok input and
    $15/MTok output with an introductory-pricing footnote. The pricing page
    should remain the source of truth for temporary promotional rates.
  compatibilityNotes: |
    Anthropic deprecates non-default temperature, top_p, and top_k values on
    Claude Sonnet 5. Requests setting those parameters to non-default values
    return a 400 error.
